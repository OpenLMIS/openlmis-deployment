# Deployment-specific overrides for report translations.
#
# The base translations ship in the openlmis-report jar (Transifex-managed) and this
# file is merged on top of them. An override is applied only where its value actually
# DIFFERS from the shipped English source; a value identical to the source is discarded
# as a leftover copy of the base bundle. Put a locale's own wording in
# report_translations_<lang>.properties - this file applies to every locale that has no
# file of its own, so a stale copy here masks translations for locales it does not even
# contain.
#
# The service logs "applied N key(s)" and "ignored N key(s)" per locale on the first
# report generated after a restart. Both keys below are byte-identical to the source on
# purpose, so this file is inert and the service logs "ignored 2 key(s)".

### GLOBAL HEADERS
report.globalHeader.subtitle=OpenLMIS Report
report.globalHeader.title=OpenLMIS
