  one-network-integration-service:
    image: openlmis/one-network-integration-service:${OL_ONE_NETWORK_INTEGRATION_VERSION}
    env_file: settings.env
    environment:
      JAVA_OPTS: '-server -Xmx512m -Dlogback.configurationFile=/config/log/logback.xml -Dlogging.config=/config/log/logback.xml'
    volumes:
      - 'service-config:/config'
    depends_on: [service-configuration, consul]
    command: [ "/run.sh" ] 
    logging:
      <<: *logging

  db:
    image: openlmis/postgres:${OL_POSTGRES_VERSION}
    env_file: settings.env
    volumes:
        - pgdata:/var/lib/postgresql/data
    depends_on: [consul]
    logging:
      <<: *logging

  service-configuration:
    build:
      context: ./config
    volumes:
      - service-config:/config
    logging:
      <<: *logging

  ftp:
    image: driesva/proftpd
    ports:
      - "${OL_FTP_PORT_21:-21}:21"
      - "${OL_FTP_PORT_20:-20}:20"
    env_file: settings.env
    depends_on: [consul]
    logging:
      <<: *logging

  redis:
    image: redis:3.2.12
    depends_on: [consul]
    logging:
      <<: *logging

volumes:
  nginx-log:
    external: false
  auth-tomcat-log:
    external: false
  consul-template-log:
    external: false
  service-config:
    external: false
  pgdata:
    external: true
  referencedata-extension-config:
    external: false
  stockmanagement-extension-config:
    external: false     
