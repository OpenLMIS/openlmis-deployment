#    env_file: settings.env
#    environment:
#      JAVA_OPTS: '-server -Xmx512m -Dlogback.configurationFile=/config/log/logback.xml -Dlogging.config=/config/log/logback.xml'
#      spring_profiles_active: demo-data,refresh-db
#    volumes:
