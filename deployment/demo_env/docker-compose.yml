    env_file: settings.env
    environment:
      JAVA_OPTS: '-server -Xmx512m -Dlogback.configurationFile=/config/log/logback.xml -Dlogging.config=/config/log/logback.xml -Dflyway.locations=classpath:db/migration,filesystem:/demo-data'
      spring_profiles_active: ${spring_profiles_active}
    volumes:
      - 'service-config:/config'
    depends_on: [service-configuration, consul]
    command: ["/wait-for-postgres.sh", "/run.sh"]
    logging:
